services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: safiullah_portfolio
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-false}
      - SECRET_KEY=${SECRET_KEY:-generate-a-secure-random-secret-key}
      - CONTACT_RECIPIENT_EMAIL=${CONTACT_RECIPIENT_EMAIL:-safiullah477845@gmail.com}
      - MAIL_SERVER=${MAIL_SERVER:-smtp.gmail.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USE_TLS=${MAIL_USE_TLS:-true}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
    volumes:
      - portfolio_data:/app/instance
      - portfolio_uploads:/app/static/uploads
      - portfolio_logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  portfolio_data:
  portfolio_uploads:
  portfolio_logs:
