<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Error{% endblock %} — Safi Ullah Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous">
    <style>
        :root { --primary: #5fbcb8; --dark: #1a1a1a; --card: #1e293b; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: var(--dark); color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; text-align: center; }
        .error-code { font-size: 8rem; font-weight: 800; color: var(--primary); line-height: 1; opacity: 0.2; }
        .error-icon { font-size: 4rem; color: var(--primary); margin: -1rem 0 1rem; }
        h1 { font-size: 2rem; font-weight: 700; margin-bottom: 0.75rem; }
        p { color: #94a3b8; max-width: 480px; line-height: 1.6; margin-bottom: 2rem; }
        .btn { padding: 0.8rem 1.8rem; border-radius: 10px; font-weight: 600; font-size: 0.95rem; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 0.5rem; transition: all 0.3s; background: var(--primary); color: #fff; border: none; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(95,188,184,0.3); }
    </style>
</head>
<body>
    <div class="error-code">{% block code %}000{% endblock %}</div>
    <div class="error-icon"><i class="{% block icon_class %}fas fa-exclamation-circle{% endblock %}"></i></div>
    <h1>{% block heading %}An Error Occurred{% endblock %}</h1>
    <p>{% block message %}Something went wrong. Please try again.{% endblock %}</p>
    <a href="/" class="btn"><i class="fas fa-home"></i> Return Home</a>
</body>
</html>
