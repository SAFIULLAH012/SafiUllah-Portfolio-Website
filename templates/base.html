<!DOCTYPE html>
<html lang="en" class="scroll-smooth" itemscope itemtype="https://schema.org/WebPage">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- ══ PRIMARY SEO META ══ -->
    <title>{% block title %}Safi Ullah | Computer Science & Machine Learning Portfolio{% endblock %}</title>
    <meta name="description" content="{% block meta_description %}Explore Machine Learning, Computer Vision, and Deep Learning projects built by Safi Ullah, Computer Science student at University of Layyah.{% endblock %}">
    <meta name="keywords" content="Safi Ullah, SAFI ULLAH, safi ullah, SAFIULLAH, SafiUllah, safiullah, Safi Ullah portfolio, Safi Ullah machine learning, Safi Ullah computer science, Safi Ullah AI student, Safi Ullah computer vision, machine learning portfolio, AI student portfolio, computer vision portfolio, deep learning portfolio, Python ML developer, Pakistan, University of Layyah, SAFIULLAH012">
    <meta name="author" content="Safi Ullah">
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
    <meta name="googlebot" content="index, follow">
    <meta name="revisit-after" content="7 days">
    <meta name="language" content="English">
    <meta name="google-site-verification" content="XH9kibBHJIuVUUgmxhZvvb_EzSKrf5-E5PQmVh4Tvac">
    <meta name="geo.region" content="PK">
    <meta name="geo.placename" content="Pakistan">

    <!-- ══ CANONICAL ══ -->
    <link rel="canonical" href="{{ request.base_url }}">

    <!-- ══ FAVICON ══ -->
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/favicon.svg') }}">

    <!-- ══ OPEN GRAPH (Facebook / LinkedIn) ══ -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Safi Ullah Portfolio">
    <meta property="og:locale" content="en_US">
    <meta property="og:title" content="{% block og_title %}Safi Ullah | Computer Science & Machine Learning Portfolio{% endblock %}">
    <meta property="og:description" content="{% block og_description %}Explore Machine Learning, Computer Vision, and Deep Learning projects built by Safi Ullah, Computer Science student at University of Layyah.{% endblock %}">
    <meta property="og:url" content="{{ request.base_url }}">
    <meta property="og:image" content="{{ url_for('static', filename=settings.profile_image if settings else 'img/safiullah_profile.jpeg', _external=True) }}">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Safi Ullah - Computer Science & Machine Learning Portfolio">

    <!-- ══ TWITTER CARD ══ -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@SAFIULLAH012">
    <meta name="twitter:creator" content="@SAFIULLAH012">
    <meta name="twitter:title" content="Safi Ullah | Computer Science & Machine Learning Portfolio">
    <meta name="twitter:description" content="Explore Machine Learning, Computer Vision, and Deep Learning projects built by Safi Ullah, Computer Science student at University of Layyah.">
    <meta name="twitter:image" content="{{ url_for('static', filename=settings.profile_image if settings else 'img/safiullah_profile.jpeg', _external=True) }}">

    <!-- ══ JSON-LD STRUCTURED DATA — Person & Professional Service Schema ══ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Safi Ullah",
      "alternateName": [
        "SafiUllah",
        "safi ullah",
        "SAFI ULLAH",
        "Safiullah",
        "safiullah",
        "SAFIULLAH",
        "Safi Ullah AI",
        "safi ullah machine learning",
        "safi ullah portfolio",
        "SAFIULLAH012",
        "safiullah012"
      ],
      "url": "{{ request.host_url }}",
      "image": "{{ url_for('static', filename=settings.profile_image if settings else 'img/safiullah_profile.jpeg', _external=True) }}",
      "jobTitle": "Computer Science Student & Machine Learning Enthusiast",
      "description": "Safi Ullah is a Computer Science student at the University of Layyah, Pakistan, specializing in Computer Vision, Machine Learning, Deep Learning (CNNs), MediaPipe, OpenCV, and Python development.",
      "nationality": "Pakistani",
      "hasOccupation": {
        "@type": "Occupation",
        "name": "Machine Learning Developer & CS Student",
        "occupationLocation": {
          "@type": "Country",
          "name": "Pakistan"
        },
        "skills": "Machine Learning, Deep Learning, Computer Vision, MediaPipe, OpenCV, TensorFlow, Keras, CNN, Python, Flask, Streamlit, Scikit-Learn"
      },
      "knowsAbout": [
        "Machine Learning",
        "Deep Learning",
        "Computer Vision",
        "Convolutional Neural Networks",
        "MediaPipe",
        "Python",
        "Flask",
        "Streamlit",
        "OpenCV",
        "TensorFlow",
        "Keras",
        "Data Science",
        "Predictive Modeling"
      ],
      "sameAs": [
        "{{ settings.github_url if settings else 'https://github.com/SAFIULLAH012' }}",
        "{{ settings.linkedin_url if settings else '' }}"
      ],
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "PK",
        "addressRegion": "Pakistan"
      }
    }
    </script>

    <!-- ══ JSON-LD — Website Schema ══ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Safi Ullah Portfolio",
      "url": "{{ request.host_url }}",
      "description": "Portfolio website of Safi Ullah – AI & Machine Learning Engineer, Computer Vision specialist from Pakistan.",
      "author": {
        "@type": "Person",
        "name": "Safi Ullah"
      },
      "potentialAction": {
        "@type": "SearchAction",
        "target": "{{ request.host_url }}#projects",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- ══ FONTS & ICONS ══ -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css', v='5.7') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <a href="#main-content" class="skip-link sr-only" style="position: absolute; top: -100px; left: 1rem; z-index: 9999; padding: 0.5rem 1rem; background: var(--dark, #0f172a); color: var(--primary, #5fbcb8); border-radius: 4px; transition: top 0.2s;" onfocus="this.style.top='1rem'" onblur="this.style.top='-100px'">Skip to main content</a>

    {% block body %}{% endblock %}

    <script src="{{ url_for('static', filename='js/script.js', v='4.0') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
