<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password — Portfolio CMS</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body class="login-body">
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo"><i class="fas fa-key"></i></div>
                <h1>Forgot Password</h1>
                <p>Enter your username or email to receive a 6-digit OTP verification code</p>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                <div class="flash flash--{{ category }}" role="alert" style="margin-bottom: 1.25rem;">
                    <i class="fas fa-info-circle"></i> {{ message }}
                </div>
                {% endfor %}
            {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('admin.forgot_password') }}" class="login-form" novalidate>
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="form-group">
                    <label for="identifier"><i class="fas fa-user-circle"></i> Admin Username or Email</label>
                    <input type="text" id="identifier" name="identifier" placeholder="e.g. admin or your@email.com" required
                           autofocus class="form-control">
                </div>

                <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1rem;">
                    <i class="fas fa-paper-plane"></i> Send Verification Code
                </button>
            </form>

            <div class="login-footer">
                <a href="{{ url_for('admin.login') }}">← Back to Login</a>
            </div>
        </div>
    </div>
</body>
</html>
