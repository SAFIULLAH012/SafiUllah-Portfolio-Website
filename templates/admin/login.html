<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — Portfolio CMS</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body class="login-body">
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">SA</div>
                <h1>Portfolio CMS</h1>
                <p>Sign in to manage your portfolio</p>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                <div class="flash flash--{{ category }}" role="alert">
                    <i class="fas fa-exclamation-circle"></i> {{ message }}
                </div>
                {% endfor %}
            {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('admin.login') }}" class="login-form" autocomplete="on" novalidate>
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="form-group">
                    <label for="identifier"><i class="fas fa-user"></i> Username or Email</label>
                    <input type="text" id="identifier" name="identifier" placeholder="Enter username or email" required
                           autocomplete="username" autofocus class="form-control">
                </div>

                <div class="form-group">
                    <label for="password"><i class="fas fa-lock"></i> Password</label>
                    <div class="input-toggle-wrapper">
                        <input type="password" id="password" name="password" placeholder="Enter password" required
                               autocomplete="current-password" class="form-control">
                        <button type="button" class="toggle-password" onclick="togglePassword()" aria-label="Toggle password visibility">
                            <i class="fas fa-eye" id="toggleIcon"></i>
                        </button>
                    </div>
                </div>

                <div class="form-group-extra" style="display: flex; justify-content: space-between; align-items: center; margin-top: -0.25rem; margin-bottom: 1.25rem;">
                    <label style="display: flex; align-items: center; gap: 0.4rem; font-size: 0.82rem; color: #cbd5e1; cursor: pointer; margin: 0; font-weight: normal;">
                        <input type="checkbox" name="remember_me" id="remember_me" style="width: auto; cursor: pointer; accent-color: var(--primary);"> Remember Me
                    </label>
                    <a href="{{ url_for('admin.forgot_password') }}" style="color: var(--primary); font-size: 0.82rem; text-decoration: none;">Forgot Password?</a>
                </div>

                <button type="submit" class="btn btn-primary btn-block">
                    <i class="fas fa-sign-in-alt"></i> Sign In
                </button>
            </form>

            <div class="login-footer">
                <a href="{{ url_for('public.index') }}">← Back to public site</a>
            </div>
        </div>
    </div>
    <script>
        function togglePassword() {
            const pw = document.getElementById('password');
            const icon = document.getElementById('toggleIcon');
            if (pw.type === 'password') { pw.type = 'text'; icon.className = 'fas fa-eye-slash'; }
            else { pw.type = 'password'; icon.className = 'fas fa-eye'; }
        }
    </script>
</body>
</html>
