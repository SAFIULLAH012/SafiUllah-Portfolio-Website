<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP & Reset Password — Portfolio CMS</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body class="login-body">
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo"><i class="fas fa-shield-alt"></i></div>
                <h1>Enter OTP & Reset Password</h1>
                <p>We've sent a 6-digit verification code to <strong>{{ email }}</strong></p>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                <div class="flash flash--{{ category }}" role="alert" style="margin-bottom: 1.25rem;">
                    <i class="fas fa-info-circle"></i> {{ message }}
                </div>
                {% endfor %}
            {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('admin.reset_password_verify') }}" class="login-form" novalidate>
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="form-group">
                    <label for="otp"><i class="fas fa-shield-virus"></i> 6-Digit OTP Code <span class="required">*</span></label>
                    <input type="text" id="otp" name="otp" placeholder="123456" required
                           maxlength="6" autofocus class="form-control" style="font-size: 1.2rem; letter-spacing: 4px; text-align: center;">
                </div>

                <div class="form-group">
                    <label for="new_password"><i class="fas fa-lock"></i> New Password <span class="required">*</span></label>
                    <input type="password" id="new_password" name="new_password" placeholder="Enter new password (min 8 chars)" required
                           minlength="8" class="form-control">
                </div>

                <div class="form-group">
                    <label for="confirm_password"><i class="fas fa-check-double"></i> Confirm New Password <span class="required">*</span></label>
                    <input type="password" id="confirm_password" name="confirm_password" placeholder="Repeat new password" required
                           minlength="8" class="form-control">
                </div>

                <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1rem;">
                    <i class="fas fa-check"></i> Reset Password &amp; Login
                </button>
            </form>

            <div class="login-footer">
                <a href="{{ url_for('admin.forgot_password') }}">← Resend Code</a> &nbsp;|&nbsp;
                <a href="{{ url_for('admin.login') }}">Back to Login</a>
            </div>
        </div>
    </div>
</body>
</html>
